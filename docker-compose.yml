version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: tifawin-postgres
    environment:
      POSTGRES_DB: tifawin_x0
      POSTGRES_USER: tifawin
      POSTGRES_PASSWORD: tifawin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tifawin-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
