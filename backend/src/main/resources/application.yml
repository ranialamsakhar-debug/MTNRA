spring:
  application:
    name: tawsa-backend
  datasource:
    url: jdbc:h2:mem:tawsa_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: 9f03f6f5f5314532879c8ad2b5c1f89e9f03f6f5f5314532879c8ad2b5c1f89e
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
