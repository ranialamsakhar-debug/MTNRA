spring:
  application:
    name: tifawin-x0-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/tifawin_x0
    username: tifawin
    password: tifawin
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: 9f03f6f5f5314532879c8ad2b5c1f89e9f03f6f5f5314532879c8ad2b5c1f89e
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
